<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI RTL Fixer</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <!-- Header -->
    <header class="header">
      <div class="logo-wrap">
        <div class="logo-icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="4 7 4 4 20 4 20 7"></polyline>
            <line x1="9" y1="20" x2="15" y2="20"></line>
            <line x1="12" y1="4" x2="12" y2="20"></line>
            <polyline points="19 12 15 16 19 20"></polyline>
          </svg>
        </div>
        <div>
          <h1 class="title">AI RTL Fixer</h1>
          <span class="version">v1.0.0</span>
        </div>
      </div>
      <div class="shortcut-badge">Alt + R</div>
    </header>

    <!-- Main Master Toggle -->
    <div class="card master-card">
      <div class="toggle-row">
        <div>
          <span class="toggle-label">Auto RTL Engine</span>
          <span class="toggle-desc">Detect & format Persian / Arabic / Hebrew</span>
        </div>
        <label class="switch">
          <input type="checkbox" id="enabled-toggle">
          <span class="slider"></span>
        </label>
      </div>
    </div>

    <!-- Language Presets -->
    <div class="section-label">Language Font Preset</div>
    <div class="preset-group">
      <button class="preset-btn" data-preset="persian">فارسی</button>
      <button class="preset-btn" data-preset="arabic">العربية</button>
      <button class="preset-btn" data-preset="hebrew">עברית</button>
      <button class="preset-btn" data-preset="system">System</button>
    </div>

    <!-- Fine Tuning & Typography -->
    <div class="card">
      <div class="control-row">
        <label for="font-family-input">Custom Font</label>
        <input type="text" id="font-family-input" class="text-input" placeholder="Vazirmatn / Cairo / Assistant">
      </div>

      <div class="divider"></div>

      <div class="control-row slider-row">
        <div class="slider-header">
          <span>Line Height</span>
          <span id="line-height-val" class="val-badge">1.75</span>
        </div>
        <input type="range" id="line-height-slider" min="1.3" max="2.4" step="0.05" value="1.75">
      </div>

      <div class="control-row slider-row">
        <div class="slider-header">
          <span>Font Size</span>
          <span id="font-size-val" class="val-badge">15px</span>
        </div>
        <input type="range" id="font-size-slider" min="12" max="22" step="1" value="15">
      </div>
    </div>

    <!-- Advanced Settings -->
    <div class="card">
      <div class="toggle-row mini">
        <span>Force RTL Direction</span>
        <label class="switch mini">
          <input type="checkbox" id="force-rtl-toggle">
          <span class="slider"></span>
        </label>
      </div>
      <div class="toggle-row mini">
        <span>Shift+2 = @ (Persian keyboard)</span>
        <label class="switch mini">
          <input type="checkbox" id="fix-at-toggle">
          <span class="slider"></span>
        </label>
      </div>
      <div class="toggle-row mini">
        <span>Show On-Page Badge</span>
        <label class="switch mini">
          <input type="checkbox" id="indicator-toggle">
          <span class="slider"></span>
        </label>
      </div>
    </div>

    <!-- Footer -->
    <footer class="footer">
      <span>Works on ChatGPT, Claude, DeepSeek, Gemini, Perplexity</span>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
